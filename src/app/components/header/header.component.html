<header class="sticky top-0 z-30 border-b border-yellow-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a routerLink="/products" class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-yellow-400 text-sm font-black text-black shadow-sm">
        S
      </div>
      <span class="text-xl font-black tracking-tight text-black">ShopFlow</span>
    </a>

    <nav class="hidden items-center gap-6 text-sm font-medium text-slate-700 md:flex">
      <a routerLink="/products" routerLinkActive="text-orange-600" [routerLinkActiveOptions]="{ exact: true }" class="transition hover:text-black">
        Catálogo
      </a>
      <a routerLink="/configuracion" routerLinkActive="text-orange-600" class="transition hover:text-black">
        Configuración
      </a>
      <a routerLink="/cart" routerLinkActive="text-orange-600" class="transition hover:text-black">
        Carrito
      </a>
      <a routerLink="/checkout" routerLinkActive="text-orange-600" class="transition hover:text-black">
        Pago
      </a>
    </nav>

    <a routerLink="/cart" class="inline-flex items-center gap-3 rounded-full border border-yellow-300 bg-yellow-50 px-3 py-2 text-sm font-bold text-black transition hover:border-orange-300 hover:bg-yellow-100">
      <span>Carrito</span>
      <span class="inline-flex min-w-6 items-center justify-center rounded-full bg-black px-2 py-0.5 text-xs font-bold text-yellow-300">
        {{ itemCount() }}
      </span>
    </a>
  </div>
</header>
